name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Releases run one at a time, so the newest version is always published last.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: node dist/cli/main.js run examples/lifecycle-fixture.yaml

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set version
        id: version
        # The major and minor numbers come from package.json. The run number is the patch number.
        run: |
          BASE="$(jq -r '.version' package.json | cut -d . -f 1-2)"
          VERSION="$BASE.$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          jq --arg version "$VERSION" '.version = $version' package.json > package.tmp
          mv package.tmp package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack
        run: pnpm pack --pack-destination out

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error

  stage:
    name: Stage on npm
    needs: [check, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing uses this token. No npm secret is necessary.
      # This job runs no build scripts, so no dependency can use the token.
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: out

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage
        # The version is not public until a maintainer approves it on npmjs.com.
        run: npm stage publish out/*.tgz --access public --ignore-scripts

  release:
    name: Release
    needs: [pack, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          name: streamdeck-harness ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/*.tgz
